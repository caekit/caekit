name: Verify CAEKit

# Every job here has a command in README.md ("Reproduce CI locally"). Actions are pinned to
# commit SHAs; the comment names the release that the SHA points at.

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native tests (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      # caekit-py and caekit-wasm need their own toolchains; they have dedicated jobs below.
      - name: Test the workspace, the documentation examples and the native CLI
        run: cargo +stable test --workspace --exclude caekit-py --exclude caekit-wasm --locked

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test with the declared minimum Rust version
        shell: bash
        run: |
          rust_version=$(cargo +stable metadata --no-deps --format-version 1 --locked |
            jq -er '.packages[] | select(.name == "caekit") | .rust_version |
              if test("^[0-9]+\\.[0-9]+$") then . + ".0" else . end')
          rustup toolchain install "$rust_version" --profile minimal
          cargo "+$rust_version" test --workspace --exclude caekit-py --exclude caekit-wasm --locked
          cargo "+$rust_version" check -p caekit-py -p caekit-wasm --locked

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - name: Build the API documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --locked
      - name: Check that the pages match the code
        run: node scripts/check-docs.mjs

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - name: Versions, package READMEs and licence copies
        run: node scripts/release.mjs check
      - name: Package and build every publishable crate from its packaged sources
        run: node scripts/release.mjs publish-crates --dry-run

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  wasm-library:
    name: WebAssembly library (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: cargo +stable build --lib -p caekit --target wasm32-unknown-unknown --release --locked

  wasi:
    name: WASI tests and reference cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: node ${{ github.workspace }}/scripts/run-wasi.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-wasip1
      - name: Run reference physics and numerical tests in WebAssembly
        run: cargo +stable test --workspace --exclude caekit-cli --exclude caekit-py --exclude caekit-wasm --target wasm32-wasip1 --locked --tests
      - name: Build native and WASI CLIs
        run: |
          cargo +stable build --locked -p caekit-cli
          cargo +stable build --locked -p caekit-cli --target wasm32-wasip1
      - name: Compare native and WASI CLI physics on the saved models
        run: node scripts/verify-reference-cases.mjs target/debug/caekit target/wasm32-wasip1/debug/caekit.wasm

  python:
    name: Python package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          args: --release --locked --out dist
          working-directory: crates/caekit-py
          manylinux: auto
      - name: Install the wheel and run the tests and documentation examples
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links crates/caekit-py/dist caekit
          python -m pytest crates/caekit-py/tests -q

  npm:
    name: npm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Install the prebuilt wasm-bindgen CLI that matches Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/[^0-9.]/, "", $0); print; exit}' Cargo.lock)
          mkdir -p crates/caekit-wasm/.tools
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C crates/caekit-wasm/.tools
      - name: Build the package within its size budget
        run: node crates/caekit-wasm/build.mjs --check-size
      - name: Run the tests and documentation examples on the Node build
        run: node --test "crates/caekit-wasm/tests/*_test.mjs"
      - name: Pack the package, install it and exercise every entry point
        run: node crates/caekit-wasm/tests/package_smoke.mjs --pack crates/caekit-wasm/npm

  required:
    name: Required CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [native, msrv, rustfmt, clippy, documentation, packaging, deny, wasm-library, wasi, python, npm]
    if: ${{ always() }}
    steps:
      - name: Require every verification job to succeed
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$RESULTS"
          if ! jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS" > /dev/null; then
            echo "::error::Every required verification job must succeed."
            exit 1
          fi
