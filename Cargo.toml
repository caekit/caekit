[workspace]
members = [
    "crates/caekit",
    "crates/caekit-cli",
    "crates/caekit-fluids",
    "crates/caekit-mechanics",
    "crates/caekit-mesh",
    "crates/caekit-numerics",
    "crates/caekit-py",
    "crates/caekit-thermal",
    "crates/caekit-types",
    "crates/caekit-wasm",
    "docs",
]
default-members = ["crates/caekit", "crates/caekit-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caekit/caekit"
keywords = ["cae", "simulation", "fem", "multiphysics", "engineering"]
categories = ["science", "simulation", "mathematics"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.dependencies]
caekit = { path = "crates/caekit", version = "0.1.0" }
caekit-fluids = { path = "crates/caekit-fluids", version = "0.1.0" }
caekit-mechanics = { path = "crates/caekit-mechanics", version = "0.1.0" }
caekit-mesh = { path = "crates/caekit-mesh", version = "0.1.0" }
caekit-thermal = { path = "crates/caekit-thermal", version = "0.1.0" }
caekit-types = { path = "crates/caekit-types", version = "0.1.0" }
caekit-numerics = { path = "crates/caekit-numerics", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1.20"
sha2 = "0.10"
libm = { version = "0.2.16", default-features = false }
